name: Test

on:
  push:
    branches: [ main, develop, python3 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,lxml]
    
    - name: Lint with flake8
      run: |
        flake8 pynzb --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 pynzb --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Format check with black
      run: |
        black --check pynzb/
    
    - name: Import sort check with isort
      run: |
        isort --check-only pynzb/
    
    - name: Security scan with bandit
      run: |
        bandit -r pynzb/ -ll --skip B101
    
    - name: Type check with mypy
      run: |
        mypy pynzb/ --ignore-missing-imports --show-error-codes
    
    - name: Test with pytest and coverage
      run: |
        pytest pynzb/tests.py -v --cov=pynzb --cov-report=term-missing
    
    - name: Test CLI
      run: |
        python example.py test_download_100MB.nzb 
